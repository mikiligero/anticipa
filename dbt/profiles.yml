cercanias:
  target: prod
  outputs:
    prod:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/data/warehouse/cercanias.duckdb') }}"
      # Un hilo limita el consumo al compartir recursos con Kafka y Spark.
      threads: 1
      external_root: "{{ env_var('GOLD_ROOT', '/data/gold') }}"
      settings:
        # Contenedores con poca RAM (VM de Docker): límite explícito y
        # spill a disco para las agregaciones sobre el histórico completo
        memory_limit: "1GB"
        temp_directory: "/data/warehouse/tmp"
        max_temp_directory_size: "20GB"
        preserve_insertion_order: false
