name: tfm-anticipa

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-data: &data "./data:/data"
x-token: &token ${API_TOKEN:?Ejecuta python3 scripts/init_project.py}

services:
  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    logging: *logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ingestor:
    build: ./services/ingestor
    restart: unless-stopped
    logging: *logging
    environment:
      DATA_ROOT: /data
      POLL_SECONDS: ${POLL_SECONDS:-30}
      KAFKA_BOOTSTRAP: kafka:9092
    volumes: [*data]

  stream:
    build: ./services/stream
    restart: unless-stopped
    logging: *logging
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      DATA_ROOT: /data
      KAFKA_BOOTSTRAP: kafka:9092
      TRIGGER: "30 seconds"
    volumes: [*data]

  api:
    build: ./services/api
    restart: unless-stopped
    logging: *logging
    ports: ["${API_BIND:-127.0.0.1}:${API_PORT:-18000}:8000"]
    environment:
      DATA_ROOT: /data
      API_TOKEN: *token
    volumes: [*data]

  webapp:
    build: ./services/webapp
    restart: unless-stopped
    logging: *logging
    ports: ["${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:80"]
    environment: {API_TOKEN: *token}
    depends_on: [api]
    volumes: ["./.secrets/operator.htpasswd:/etc/nginx/operator.htpasswd:ro"]

  dashboard:
    build: ./services/dashboard
    restart: unless-stopped
    logging: *logging
    ports: ["${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_PORT:-18501}:8501"]
    environment:
      DATA_ROOT: /data
    volumes: [*data]

  dbt:
    build: ./dbt
    profiles: [tools]
    environment:
      DATA_ROOT: /data
      DUCKDB_PATH: /data/warehouse/cercanias.duckdb
      GOLD_ROOT: /data/gold
    volumes: ["./dbt:/opt/dbt", *data]

  tools:
    build: ./dbt
    profiles: [tools]
    entrypoint: []
    command: [bash]
    environment:
      DATA_ROOT: /data
    volumes: ["./scripts:/opt/scripts:ro", "./dbt:/opt/dbt", *data]

volumes:
  kafka_data:
