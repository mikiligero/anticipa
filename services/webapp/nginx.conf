server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pantallas retiradas: no servir la aplicación de viajero en estas URLs.
    location ~ ^/(arquitectura/?|simulacion-modelo\.html)$ {
        return 404;
    }

    # SPA: cualquier ruta sirve el index (incluida /operador)
    location /operador {
        auth_basic "Operador";
        auth_basic_user_file /etc/nginx/operator.htpasswd;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri /index.html;
    }

    # Proxy a la API interna (endpoints públicos /app/*)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Proxy de operación: nginx inyecta el token de la API para que el
    # Centro de Control no exponga credenciales en el JavaScript del cliente
    location /api-op/ {
        auth_basic "Operador";
        auth_basic_user_file /etc/nginx/operator.htpasswd;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${API_TOKEN}";
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
