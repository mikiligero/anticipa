<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Anticipa">
  <defs>
    <linearGradient id="gA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5f2bd0"/>
      <stop offset="1" stop-color="#d63384"/>
    </linearGradient>
    <linearGradient id="gTren" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- letra A -->
  <path d="M 86 208 L 128 52 L 170 208"
        fill="none" stroke="url(#gA)" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tren (travesaño de la A) -->
  <rect x="70" y="128" width="92" height="40" rx="20" fill="url(#gTren)"/>
  <!-- reflejo superior -->
  <rect x="80" y="134" width="56" height="7" rx="3.5" fill="#ffffff" opacity=".45"/>
  <!-- base del tren -->
  <path d="M 78 176 Q 120 188 168 178"
        fill="none" stroke="#232744" stroke-width="12" stroke-linecap="round"/>

  <!-- líneas de velocidad -->
  <line x1="22" y1="132" x2="52" y2="132" stroke="#d63384" stroke-width="9" stroke-linecap="round"/>
  <line x1="14" y1="148" x2="50" y2="148" stroke="#d63384" stroke-width="9" stroke-linecap="round"/>
  <line x1="26" y1="164" x2="48" y2="164" stroke="#d63384" stroke-width="9" stroke-linecap="round"/>
</svg>
